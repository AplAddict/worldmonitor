# Homelab integration: app is private on NPM's Docker network; no host UI port.
services:
  worldmonitor:
    ports: !reset []
    networks:
      - default
      - npm_proxy
    environment:
      # Dedicated, Docker-private Hermes API boundary. The endpoint is reachable
      # only from this container's NPM bridge address under an allowlisted UFW rule.
      # LLM_API_KEY is supplied by the base Compose environment from .env.
      LLM_API_URL: "http://192.168.128.1:8643/v1/chat/completions"
      LLM_MODEL: "worldmonitorai"
      LLM_PROVIDER: "generic"
      LLM_TOOL_PROVIDER: "generic"
      LLM_REASONING_PROVIDER: "generic"
  credential-service:
    networks:
      - default
      - npm_proxy
  ais-relay:
    environment:
      # The relay's classifier uses the OLLAMA_* contract (not LLM_API_*).
      # Keep analysis on the local OpenAI-compatible Ollama endpoint.
      OLLAMA_API_URL: "http://172.17.0.1:11434"
      OLLAMA_MODEL: "qwen2.5:7b-instruct-q4_k_m"
      # Required by relay auth and app warm-pings; app receives the matching
      # WORLDMONITOR_RELAY_KEY from the base Compose service.
      RELAY_SHARED_SECRET: "${RELAY_SHARED_SECRET:?RELAY_SHARED_SECRET required}"
      WORLDMONITOR_RELAY_KEY: "${WORLDMONITOR_RELAY_KEY:?WORLDMONITOR_RELAY_KEY required}"

networks:
  # Docker's automatic pools are exhausted on this host. This dedicated /28 was
  # checked against every Docker network and host route before assignment.
  default:
    ipam:
      config:
        - subnet: 10.254.9.0/28
  npm_proxy:
    external: true
